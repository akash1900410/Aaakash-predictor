<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Akash Predictor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6fcfb;
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 36px;
      color: #111;
    }
    #result {
      margin-top: 30px;
      font-size: 24px;
      color: #333;
    }
    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Akash Predictor</h1>
  <div id="result">Fetching game data...</div>

  <script>
    const apiURL = 'https://akashproxy.fly.dev/api';

    async function fetchGameData() {
      try {
        const ts = Date.now();
        const response = await fetch(`${apiURL}?ts=${ts}`);
        const data = await response.json();

        if (data && data.Data && data.Data.length > 0) {
          const latest = data.Data[0];
          const number = latest.WinNumber;
          const color = getColor(number);
          document.getElementById('result').innerHTML = `
            <strong>Predicted Number:</strong> ${number} <br/>
            <strong>Predicted Color:</strong> ${color}
          `;
        } else {
          throw new Error("Invalid data format");
        }
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('result').innerHTML = '<span class="error">Error fetching data!</span>';
      }
    }

    function getColor(num) {
      if (num === 0 || num === 13 || num === 26) return 'Violet';
      if (num % 2 === 0) return 'Green';
      return 'Red';
    }

    fetchGameData();
    setInterval(fetchGameData, 30000); // Refresh every 30 seconds
  </script>
</body>
</html>
