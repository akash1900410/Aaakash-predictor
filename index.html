<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Akash Predictor</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f9fafb;
      padding: 20px;
      text-align: center;
    }
    h1 { font-size: 32px; margin-bottom: 10px; }
    #prediction {
      font-size: 24px;
      margin-top: 20px;
      font-weight: bold;
    }
    #history {
      font-size: 14px;
      color: #555;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>Akash Predictor</h1>
  <div id="prediction">Loading prediction...</div>
  <div id="history">Fetching game data...</div>

  <script>
    const apiUrl = 'https://akashproxy.fly.dev/api';

    function fetchDataAndPredict() {
      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          const results = data.data.list;

          const lastResults = results.slice(0, 5);
          document.getElementById("history").innerHTML = "<b>Last Results:</b><br>" + lastResults.map(r => {
            return `#${r.issueNumber} - ${r.number} (${r.color})`;
          }).join("<br>");

          const numbers = lastResults.map(r => parseInt(r.number));
          const average = Math.round(numbers.reduce((a, b) => a + b) / numbers.length);
          const nextNumber = (average + 3) % 10; // simple logic
          const color = nextNumber % 2 === 0 ? 'red' : (nextNumber % 3 === 0 ? 'violet' : 'green');

          document.getElementById("prediction").innerHTML = `Next Prediction: <span style="color:${color};">${nextNumber}</span> (${color})`;
        })
        .catch(error => {
          document.getElementById("prediction").textContent = "Error fetching data!";
          console.error(error);
        });
    }

    fetchDataAndPredict();
    setInterval(fetchDataAndPredict, 30000); // 30s refresh
  </script>
</body>
</html>
